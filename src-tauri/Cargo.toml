[package]
name = "xitrum-ai-studio"
version = "0.8.2"
description = "Xitrum AI Studio desktop app on Tauri v2"
authors = ["you"]
edition = "2021"

[lib]
name = "xitrum_ai_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# Async + queue
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
tokio-util = "0.7"
async-trait = "0.1"

# Persistence
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Rembg (ONNX Runtime)
ort = "2.0.0-rc.15"
ndarray = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# System opener
opener = "0.7"
url = "2.5.8"
base64 = "0.23.1"
sha2 = "0.10"
reqwest = { version = "0.13.5", features = ["json", "default-tls", "socks"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

